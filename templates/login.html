
{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p>Login to your SAHIVEX account</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <label>Username or Email</label>
            <input type="text" name="login_id"
                   placeholder="Enter username or email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Create Account</a>
        </p>
    </div>
</div>

<style>
.auth-container {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}
.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    color: #172033;
}
.auth-card h1 {
    text-align: center;
    margin-bottom: 8px;
}
.auth-card > p {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}
.auth-card label {
    display: block;
    margin: 15px 0 7px;
}
.auth-card input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5dce5;
    border-radius: 9px;
    box-sizing: border-box;
}
.auth-card button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
.auth-footer {
    margin-top: 22px;
    font-size: 14px;
}
.auth-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
{% endblock %}
